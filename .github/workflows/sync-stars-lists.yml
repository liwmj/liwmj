name: Sync Stars Lists

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      reconcile:
        description: 'Fix state to match actual GitHub Lists (after manual drags)'
        type: boolean
        default: false

permissions: {}            # least privilege at workflow level

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit state files back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync stars to Lists
        if: ${{ github.event.inputs.reconcile != 'true' }}
        env:
          GH_STAR_TOKEN: ${{ secrets.STARS_PAT }}
        run: |
          python scripts/star_classifier.py liwmj --sync --ci

      - name: Reconcile state with Lists
        if: ${{ github.event.inputs.reconcile == 'true' }}
        env:
          GH_STAR_TOKEN: ${{ secrets.STARS_PAT }}
        run: |
          python scripts/star_classifier.py liwmj --reconcile --ci

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stars_state.json stars_data.json stars_categorized.md stars_categorized.html
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update stars sync state [skip ci]"
            git push
            echo "✅ State committed"
          fi
